name: Build Expo APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Install Expo CLI
        run: |
          npm install -g expo-cli @expo/cli

      - name: Run Expo Prebuild (generate android folder)
        run: |
          npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"

      - name: Find APK file
        run: |
          echo "=== Looking for APK files ==="
          find android -name "*.apk" -type f
          APK_PATH=$(find android -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK: $APK_PATH"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: myanmar-link-field-app-release
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Build Summary
        run: |
          echo "============================================"
          echo "BUILD SUCCESSFUL!"
          echo "APK: ${{ env.APK_PATH }}"
          echo "Download the APK from GitHub Actions Artifacts"
          echo "============================================"
