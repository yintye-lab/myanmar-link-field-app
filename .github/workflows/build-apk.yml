name: Build Expo APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Setup EAS CLI
        run: npm install -g eas-cli
      
      - name: Build APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "Starting EAS Build..."
          eas build --platform android --profile preview --non-interactive --wait 2>&1 | tee build-output.txt
          echo "=== Build Output ==="
          cat build-output.txt | tail -50
          APK_URL=$(grep -oP 'https://[^\s]+\.apk' build-output.txt | head -1)
          if [ -z "$APK_URL" ]; then
            APK_URL=$(grep -oP 'https://expo\.dev/artifacts/eas/[^\s]+' build-output.txt | head -1)
          fi
          if [ -z "$APK_URL" ]; then
            APK_URL=$(grep -oP 'https://[^\s]+(artifact|download)[^\s]*' build-output.txt | head -1)
          fi
          echo ""
          echo "============================================"
          echo "APK DOWNLOAD URL: $APK_URL"
          echo "============================================"
          echo "APK_URL=$APK_URL" >> $GITHUB_ENV
          echo "APK_URL=$APK_URL" >> $GITHUB_OUTPUT
      
      - name: Save APK URL to file
        run: |
          echo "APK Download URL: ${{ env.APK_URL }}" > apk-download-url.txt
          echo "" >> apk-download-url.txt
          echo "Build completed at: $(date)" >> apk-download-url.txt
          cat apk-download-url.txt
      
      - name: Upload APK URL info
        uses: actions/upload-artifact@v4
        with:
          name: apk-download-info
          path: |
            apk-download-url.txt
            build-output.txt
          retention-days: 30
